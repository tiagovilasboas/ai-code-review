# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: ai-code-review

before:
  hooks:
    - go mod tidy -diff

builds:
  - id: review
    main: ./cmd/review
    binary: review
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/tiagovilasboas/ai-code-review/internal/version.Version={{.Version}}

archives:
  - id: review
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - SECURITY.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs"
      - "^chore"
      - "^test"

release:
  draft: false
  prerelease: auto
